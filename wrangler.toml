# wrangler.toml
# walkermath.com as one Cloudflare Worker: the static Astro build is served as assets, /api/* runs
# src/worker/index.ts (the handlers in functions/, through src/worker/router.ts), and the
# LessonRoom Durable Object (live lessons) lives in this same Worker.
#
#   local:   npm run build && npx wrangler dev        (http://localhost:8787)
#   deploy:  npm run build && npx wrangler deploy     (or Workers Builds on push to master)
#
# Secrets (production: npx wrangler secret put <NAME>; local: .dev.vars):
#   AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ADMIN_EMAIL, PROFANITY_BLOCKLIST (optional)

name = "walkermath"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"

# Served only at walkermath.com: no workers.dev address and no preview URLs, so there is one
# address for the school's filter and for Google sign-in.
workers_dev = false
preview_urls = false
routes = [{ pattern = "walkermath.com", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
# Only /api/* runs code; every other path is a file from dist/ (Astro's pages, scripts, images).
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

# Request logs in the Cloudflare dashboard (Workers > walkermath > Logs).
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "walkermath-leaderboards"
database_id = "1922dc41-cbeb-4f1e-960f-83a43ada72a4"

# Live lesson rooms: one per running lesson (src/worker/LessonRoom.ts).
[[durable_objects.bindings]]
name = "LESSON_ROOM"
class_name = "LessonRoom"

# SQLite-backed class (the only kind the Workers Free plan allows, and Cloudflare's recommendation).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LessonRoom"]
